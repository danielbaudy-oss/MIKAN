name: Supabase Keep-Alive

# Runs every 3 days to prevent Supabase free-tier auto-pause
# (Supabase auto-pauses a project after 7 consecutive days of no activity).
on:
  schedule:
    - cron: '30 9 */3 * *'  # 09:30 UTC every 3 days (offset from WorldClass to spread load)
  workflow_dispatch:        # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MIKAN Restaurant
        run: |
          echo "Pinging MIKAN Supabase..."
          curl -sS -f \
